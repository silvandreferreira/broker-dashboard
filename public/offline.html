<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d6efd" />
    <title>Finanza – sem ligação</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #212529; }
      main { text-align: center; padding: 24px; max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: #6c757d; margin: 0 0 20px; }
      button { background: #0d6efd; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem ligação à internet</h1>
      <p>O Finanza precisa de rede para ir buscar os teus dados. Volta a tentar quando tiveres ligação.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
